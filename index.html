<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="description" content="Fit For Life — your personal AI-grade gym trainer. Personalized workout plans for every body, every goal, anywhere." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Fit For Life — Train Anywhere. Transform Everywhere.</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app"></div>

  <!-- Rest timer overlay (populated by app.js) -->
  <div id="timer-overlay" class="timer-overlay hidden" aria-hidden="true"></div>

  <!-- Toast notifications -->
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="js/data.js"></script>
  <script src="js/plans.js"></script>
  <script src="js/app.js"></script>
  <!-- GoatCounter analytics — anonymous, no cookies, GDPR-friendly.
       Dashboard: https://fitforlife.goatcounter.com -->
  <script data-goatcounter="https://fitforlife.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
